# Stick with the main project files for now
excludes = ["*.lock", ".gitignore", ".envrc", ".tack/**", ".config/**", ".github/**"]
on-unmatched = "warn"

[formatter.nixfmt]
command = "alejandra"
includes = ["*.nix"]

[formatter.deno]
command = "deno"
options = [ "fmt" ]
includes = [ "*.md" ]
excludes = [ ".tack/*" ]
