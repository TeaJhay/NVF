[shorturls]
gh = "github:{path}"
channel = "https://channels.nixos.org/{path}/nixexprs.tar.xz"
[all_follow]
nixpkgs = "nixpkgs"
[omit_inputs]
[signers]
[inputs]
# Base inputs
[inputs.nixpkgs]
url = "channel:nixpkgs-unstable"
group = "Base"
[inputs.nvf]
url = "github:notashelf/nvf"
group = "Base"

# Specific plugins for editing and functions
[inputs."sshfs.nvim"]
url = "github:uhs-robert/sshfs.nvim"
type = "fetch"
group = "Plugins"
[inputs.nixd]
url = "github:nix-community/nixd"
group = "Plugins"
[inputs."jj.nvim"]
url = "github:NicolasGB/jj.nvim"
type = "fetch"
group = "Plugins"
[inputs."rustlings.nvim"]
url = "github:martifaj/rustlings.nvim"
type = "fetch"
group = "Plugins"

# plugins for themes
[inputs."matugen.nvim"]
url = "github:Senal-D-A-Gunaratna/matugen.nvim"
type = "fetch"
group = "Themes"
[inputs."aquavium.nvim"]
url = "github:t-b-t-nchos/aquavium.nvim"
type = "fetch"
group = "Themes"
[inputs."oasis.nvim"]
url = "github:uhs-robert/oasis.nvim"
type = "fetch"
group = "Themes"
